<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dame Marcha CMS</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // 1. WIDGET SPOTIFY TIPO WORDPRESS
      CMS.registerEditorComponent({
        id: "spotify",
        label: "🎵 Spotify",
        fields: [
          {
            name: "url",
            label: "Enlace de Spotify",
            widget: "string",
            hint: "Pega la URL de la canción, álbum o playlist"
          }
        ],
        // Reconoce tanto la sintaxis limpia como etiquetas antiguas
        pattern: /^(?:\{\{<\s*spotify\s+"([^"]+)"\s*>\}\}|<iframe[^>]*src="https:\/\/open\.spotify\.com\/embed\/([^"]+)"[^>]*><\/iframe>)/,
        fromBlock: function(match) {
          if (match[1]) return { url: match[1] };
          if (match[2]) return { url: "https://open.spotify.com/" + match[2] };
          return { url: "" };
        },
        toBlock: function(obj) {
          if (!obj.url) return "";
          return '{{< spotify "' + obj.url.trim() + '" >}}';
        },
        toPreview: function(obj) {
          if (!obj.url) return '<div style="padding: 10px; color: #888;">Introduce una URL de Spotify...</div>';
          var cleanUrl = obj.url.trim().replace(/open\.spotify\.com\/(?:intl-[a-z]+\/)?/, "open.spotify.com/embed/");
          return '<div style="padding: 12px; background: #121212; border-radius: 12px; text-align: center;"><iframe src="' + cleanUrl + '" width="100%" height="152" frameborder="0" allowtransparency="true" allow="encrypted-media" style="border-radius: 8px;"></iframe></div>';
        }
      });

      // 2. WIDGET INSTAGRAM TIPO WORDPRESS
      CMS.registerEditorComponent({
        id: "instagram",
        label: "📸 Instagram",
        fields: [
          {
            name: "url",
            label: "URL del Post / Reel",
            widget: "string",
            hint: "Ejemplo: https://www.instagram.com/p/C_EXAMPLE/"
          }
        ],
        pattern: /^(?:\{\{<\s*instagram\s+"([^"]+)"\s*>\}\}|https?:\/\/(?:www\.)?instagram\.com\/(?:p|reel)\/([^/?#&]+))/,
        fromBlock: function(match) {
          return { url: match[1] || match[0] };
        },
        toBlock: function(obj) {
          if (!obj.url) return "";
          return '{{< instagram "' + obj.url.trim() + '" >}}';
        },
        toPreview: function(obj) {
          if (!obj.url) return '<div style="padding: 10px; color: #888;">Introduce una URL de Instagram...</div>';
          var cleanUrl = obj.url.trim().split('?')[0].replace(/\/$/, "");
          return '<div style="display: flex; justify-content: center; background: #fafafa; padding: 12px; border: 1px solid #e0e0e0; border-radius: 12px;"><iframe src="' + cleanUrl + '/embed" width="400" height="480" frameborder="0" scrolling="no"></iframe></div>';
        }
      });

      // 3. WIDGET GALERÍA TIPO WORDPRESS
      CMS.registerEditorComponent({
        id: "gallery",
        label: "🖼️ Galería de Imágenes",
        fields: [
          {
            name: "images",
            label: "Imágenes de la Galería",
            widget: "list",
            field: { label: "Imagen", name: "image", widget: "image" }
          }
        ],
        pattern: /^<div class="cms-gallery">(.*?)<\/div>$/s,
        fromBlock: function(match) {
          return { images: [] };
        },
        toBlock: function(obj) {
          if (!obj.images || !obj.images.length) return "";
          var imgTags = obj.images.map(function(img) {
            return '<img src="' + img + '" alt="Imagen de galería" />';
          }).join('\n  ');
          return '<div class="cms-gallery">\n  ' + imgTags + '\n</div>';
        },
        toPreview: function(obj) {
          if (!obj.images || !obj.images.length) return '<div style="padding: 10px; color: #888;">Selecciona imágenes para la galería...</div>';
          var imgTags = obj.images.map(function(img) {
            return '<img src="' + img + '" style="width: 120px; height: 120px; object-fit: cover; margin: 4px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);" />';
          }).join('');
          return '<div style="display: flex; flex-wrap: wrap; gap: 8px; background: #f8f9fa; padding: 12px; border-radius: 12px; border: 1px dashed #ccc;">' + imgTags + '</div>';
        }
      });
    </script>
  </body>
</html>
