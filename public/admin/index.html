<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dame Marcha CMS</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      CMS.registerEditorComponent({
        id: "spotify",
        label: "🎵 Spotify",
        fields: [
          {
            name: "url",
            label: "Enlace de Spotify",
            widget: "string"
          }
        ],
        // Detecta shortcodes, iframes y enlaces sueltos de Spotify (https://open.spotify.com/...)
        pattern: /(?:\{\{<\s*spotify\s+["']?([^"'\s>]+)["']?\s*>\}\}|https?:\/\/open\.spotify\.com\/(?:intl-[a-z]+\/)?(album|track|playlist)\/([a-zA-Z0-9]+))/s,
        fromBlock: function(match) {
          if (match[1]) {
            return { url: match[1] };
          }
          if (match[2] && match[3]) {
            return { url: "https://open.spotify.com/" + match[2] + "/" + match[3] };
          }
          return { url: "" };
        },
        toBlock: function(obj) {
          if (!obj.url) return "";
          var cleanUrl = obj.url.trim().split('?')[0];
          return '{{< spotify "' + cleanUrl + '" >}}';
        },
        toPreview: function(obj) {
          if (!obj || !obj.url) {
            return '<div style="padding:12px; background:#222; color:#fff; border-radius:8px; text-align:center;">🎵 Spotify (Introduce URL)</div>';
          }
          var cleanUrl = obj.url.trim()
            .replace("open.spotify.com/", "open.spotify.com/embed/")
            .replace(/\/embed\/intl-[a-z]+\//, "/embed/")
            .split('?')[0];

          return (
            '<div style="padding:10px; background:#121212; border-radius:12px; margin:10px 0;">' +
              '<iframe src="' + cleanUrl + '" width="100%" height="152" frameborder="0" allowtransparency="true" allow="encrypted-media" style="border-radius:8px;"></iframe>' +
            '</div>'
          );
        }
      });
    </script>
  </body>
</html>
