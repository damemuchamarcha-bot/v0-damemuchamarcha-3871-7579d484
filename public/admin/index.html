<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dame Marcha CMS</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // 1. WIDGET SPOTIFY (Soporta iframe y shortcode)
      CMS.registerEditorComponent({
        id: "spotify",
        label: "🎵 Spotify",
        fields: [
          {
            name: "url",
            label: "Enlace de Spotify",
            widget: "string",
            hint: "Pega la URL del álbum, canción o playlist"
          }
        ],
        // Captura tanto shortcodes como iframes previa o posteriormente insertados
        pattern: /(?:\{\{<\s*spotify\s+"?([^"\s>]+)"?\s*>\}\}|<iframe[^>]*src="https:\/\/open\.spotify\.com\/embed\/([^"?]+)[^"]*"[^>]*><\/iframe>)/s,
        fromBlock: function(match) {
          var val = match[1] || match[2] || "";
          if (val && !val.startsWith("http")) {
            val = "https://open.spotify.com/" + val;
          }
          return { url: val.replace(/[\r\n\s]+/g, "") };
        },
        toBlock: function(obj) {
          if (!obj.url) return "";
          var clean = obj.url.replace(/[\r\n\s]+/g, "").split('?')[0];
          return '{{< spotify "' + clean + '" >}}';
        },
        toPreview: function(obj) {
          if (!obj.url) return '<div style="padding: 10px; color: #888;">Introduce una URL de Spotify...</div>';
          var cleanUrl = obj.url.replace(/[\r\n\s]+/g, "")
            .replace("open.spotify.com/", "open.spotify.com/embed/")
            .replace(/\/embed\/intl-[a-z]+\//, "/embed/")
            .split('?')[0];

          return '<div style="padding: 10px; background: #121212; border-radius: 12px; text-align: center;">' +
                   '<iframe src="' + cleanUrl + '" width="100%" height="152" frameborder="0" allowtransparency="true" allow="encrypted-media" style="border-radius: 8px;"></iframe>' +
                 '</div>';
        }
      });
    </script>
  </body>
</html>
